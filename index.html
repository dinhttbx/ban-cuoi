        function removeVietnameseTones(str) {
            if (!str) return '';
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            str = str.replace(/[^a-zA-Z0-9]/g, "");
            return str.toLowerCase();
        }

            const [subTabNhapLieu, setSubTabNhapLieu] = useState('tiepdan');

            const [formLichTiepBiThu, setFormLichTiepBiThu] = useState({

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError('');
                const u = removeVietnameseTones(loginForm.username.trim());

                const foundUser = usersList.find(usr => usr.username === u);

                        if (foundUser.role === 'CAP_XA') {

                        } else {

                        }
                        return;
                    } else {
                        setLoginError('Mật khẩu không chính xác!');
                        return;
                    }
                }
                setLoginError('Tên tài khoản không tồn tại trên hệ thống!');

                    pass: (newAccForm.password || '12345678*@Ab').trim(),

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Ngày ra Kết luận</label>
                                            <input 
                                                type="date" 
                                                value={processForm.ngayKetLuan} 
                                                onChange={(e) => setProcessForm({...processForm, ngayKetLuan: e.target.value})}
                                                className="w-full p-2 border border-slate-300 rounded-lg text-sm" 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Tệp Kết luận đính kèm (.pdf, .doc)</label>
                                        <input type="file" accept=".doc,.docx,.pdf" onChange={(e) => handleGenericFileChange(e, 'fileSoVanBan', setProcessForm)} className="w-full text-xs p-1 border border-slate-300 rounded-lg" />
                                        {processForm.fileSoVanBan && <p className="text-[11px] text-emerald-600 mt-1">✓ File: {processForm.fileSoVanBan}</p>}
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                                        <button type="button" onClick={() => setShowProcessModal(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-xs">Hủy</button>
                                        <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs">Lưu Cập Nhật</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL PHÁT HÀNH VĂN BẢN ĐÔN ĐỐC (DÀNH CHO ADMIN) */}
                    {showDonDocModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-xl rounded-2xl shadow-2xl p-6 border border-slate-200">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                                    <h3 className="font-bold text-rose-800 text-base">📝 Phát hành Công văn Đôn đốc giải quyết Vụ việc Quá hạn</h3>
                                    <button onClick={() => setShowDonDocModal(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                                </div>

                                <form onSubmit={handleSendDonDoc} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Số Công văn đôn đốc</label>
                                            <input type="text" required value={formDonDoc.soVanBan} onChange={e => setFormDonDoc({...formDonDoc, soVanBan: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm font-mono text-red-700 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Ngày ban hành</label>
                                            <input type="date" required value={formDonDoc.ngayBanHanh} onChange={e => setFormDonDoc({...formDonDoc, ngayBanHanh: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Trích yếu nội dung công văn</label>
                                        <input type="text" required value={formDonDoc.trichYeu} onChange={e => setFormDonDoc({...formDonDoc, trichYeu: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Hạn báo cáo kết quả</label>
                                        <input type="date" required value={formDonDoc.hanBaoCao} onChange={e => setFormDonDoc({...formDonDoc, hanBaoCao: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Nội dung yêu cầu chỉ đạo các xã/phường</label>
                                        <textarea rows="3" required value={formDonDoc.yCau} onChange={e => setFormDonDoc({...formDonDoc, yCau: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm"></textarea>
                                    </div>

                                    <div className="bg-rose-50 p-3 rounded-lg border border-rose-200 text-xs text-rose-800">
                                        <p className="font-bold mb-1">Danh sách Xã/Phường nhận văn bản đôn đốc ({Object.keys(danhSachXaQuaHanDetails).length} đơn vị có vụ việc quá hạn):</p>
                                        <div className="flex flex-wrap gap-1 max-h-24 overflow-y-auto mt-1">
                                            {Object.keys(danhSachXaQuaHanDetails).map(x => (
                                                <span key={x} className="bg-rose-100 text-rose-800 px-2 py-0.5 rounded font-bold text-[10px]">{x} ({danhSachXaQuaHanDetails[x].length} vụ)</span>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                                        <button type="button" onClick={() => setShowDonDocModal(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-xs">Hủy</button>
                                        <button type="submit" className="px-5 py-2 bg-rose-700 hover:bg-rose-800 text-white font-bold rounded-lg text-xs uppercase shadow">Gửi & Phát Hành Văn Bản Đôn Đốc</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL ĐỔI MẬT KHẨU */}
                    {showChangePassModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 border border-slate-200">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                                    <h3 className="font-bold text-slate-800 text-base">🔑 Đổi mật khẩu tài khoản</h3>
                                    <button onClick={() => setShowChangePassModal(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                                </div>

                                {passMsg.text && (
                                    <div className={`mb-3 p-2.5 text-xs rounded-lg text-center font-medium ${passMsg.type === 'error' ? 'bg-rose-100 text-rose-700 border border-rose-300' : 'bg-emerald-100 text-emerald-700 border border-emerald-300'}`}>
                                        {passMsg.text}
                                    </div>
                                )}

                                <form onSubmit={handleChangePassword} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu hiện tại</label>
                                        <input type="password" required value={passForm.oldPass} onChange={e => setPassForm({...passForm, oldPass: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu mới (tối thiểu 6 ký tự)</label>
                                        <input type="password" required value={passForm.newPass} onChange={e => setPassForm({...passForm, newPass: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Xác nhận mật khẩu mới</label>
                                        <input type="password" required value={passForm.confirmPass} onChange={e => setPassForm({...passForm, confirmPass: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                    </div>

                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setShowChangePassModal(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-xs">Hủy</button>
                                        <button type="submit" className="px-4 py-2 bg-red-700 hover:bg-red-800 text-white font-bold rounded-lg text-xs">Xác nhận đổi</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
